# Destroys everything in one environment. Manual only: the app is ephemeral,
# and infra-cd.yml rebuilds it with a normal apply. Type the environment name
# to confirm, so it can't be started by mistake.
#
#   confirm  -> prepare (remove the policy-created backup vault)
#            -> destroy (the same template as infra-cd: plan, then apply that
#                        exact plan, with destroy on)
name: infra-destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        type: choice
        options: [nonprod]
      confirm:
        description: "Type the environment name again to confirm"
        type: string
        required: true

permissions:
  contents: read

jobs:
  confirm:
    name: confirm
    runs-on: ubuntu-latest
    steps:
      - name: check the confirmation matches
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$ENVIRONMENT" ]; then
            echo "::error::Confirmation '$CONFIRM' doesn't match '$ENVIRONMENT'. Nothing was destroyed."
            exit 1
          fi
          echo "Destroying $ENVIRONMENT."

  # The landing zone's Deploy-VM-Backup policy puts a Recovery Services vault
  # in the app's resource group and protects the VM. Terraform doesn't manage
  # it, and a vault still holding backups can't be deleted, so neither could
  # the resource group. Remove it first. If Azure won't let it go yet (soft
  # delete keeps deleted backups for 14 days on vaults where it can't be
  # switched off), the destroy leaves the resource group and the vault, and
  # removes everything else.
  prepare:
    name: prepare ${{ inputs.environment }}
    needs: confirm
    runs-on: ubuntu-latest
    concurrency: tfstate-${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_AZUREAD: true
      ARM_USE_OIDC: true
    outputs:
      keep_resource_group: ${{ steps.vaults.outputs.keep_resource_group }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.BACKEND_AZURE_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}" \
            -backend-config="key=${{ inputs.environment }}.tfstate"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: remove policy-created backup vaults
        id: vaults
        run: |
          keep=false
          rg=$(terraform output -raw resource_group_name 2>/dev/null || true)
          if [ -z "$rg" ] || [ "$(az group exists --name "$rg")" != true ]; then
            echo "No resource group to clean up."
          else
            for vault_id in $(az resource list --resource-group "$rg" \
                                --resource-type Microsoft.RecoveryServices/vaults --query "[].id" -o tsv); do
              vault=$(basename "$vault_id")
              echo "Vault $vault"

              # Soft delete and enhanced security together: switching off
              # only soft delete is refused while enhanced security is on.
              az rest --method patch --url "https://management.azure.com${vault_id}?api-version=2024-04-01" \
                --body '{"properties":{"securitySettings":{"softDeleteSettings":{"softDeleteState":"Disabled","enhancedSecurityState":"Disabled"}}}}' \
                --output none \
                && echo "  soft delete off" \
                || echo "::warning::Vault $vault won't switch off soft delete; deleted backups stay for 14 days."

              while read -r container item; do
                [ -n "$item" ] || continue
                echo "  stopping backup and deleting data for $item"
                az backup protection disable --resource-group "$rg" --vault-name "$vault" \
                  --container-name "$container" --item-name "$item" \
                  --backup-management-type AzureIaasVM --delete-backup-data true --yes --output none \
                  || echo "::warning::Couldn't stop backup for $item."
              done < <(az backup item list --resource-group "$rg" --vault-name "$vault" -o json \
                         | jq -r '.[] | "\(.properties.containerName) \(.name)"')

              if az backup vault delete --resource-group "$rg" --name "$vault" --force --yes --output none; then
                echo "  vault deleted"
              else
                echo "::warning::Vault $vault can't be deleted yet, so $rg stays. Everything else is destroyed; run infra-destroy again later (after 14 days at most) to finish."
                keep=true
              fi
            done
          fi
          echo "keep_resource_group=$keep" >> "$GITHUB_OUTPUT"

  destroy:
    name: ${{ inputs.environment }}
    needs: prepare
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/infra-cd-template.yml
    with:
      environment: ${{ inputs.environment }}
      destroy: true
      keep_resource_group: ${{ needs.prepare.outputs.keep_resource_group == 'true' }}
