# Plans one environment's infrastructure (or its destruction), then applies
# that exact plan. Both jobs run in the GitHub environment of the same name,
# so they sign in as that landing zone's deploy identity (OIDC, no secrets)
# and use its state account. The environment only allows main.
name: infra-cd-template

on:
  workflow_call:
    inputs:
      environment:
        description: "nonprod or prod: matches infra/environments/<name>.tfvars"
        required: true
        type: string
      destroy:
        description: "Plan and apply the destruction of everything instead"
        default: false
        type: boolean
      keep_resource_group:
        description: "With destroy: leave the resource group (for resources Azure won't delete yet)"
        default: false
        type: boolean
      terraform_version:
        default: "1.16.5"
        type: string

env:
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_USE_AZUREAD: true
  ARM_USE_OIDC: true
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: plan ${{ inputs.environment }}
    runs-on: ubuntu-latest
    concurrency: tfstate-${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.BACKEND_AZURE_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}" \
            -backend-config="key=${{ inputs.environment }}.tfstate"

      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes. Apply only
      # runs when there is something to change.
      - name: terraform plan
        id: plan
        run: |
          args=(-input=false -out=tfplan -detailed-exitcode -var-file="environments/${{ inputs.environment }}.tfvars")
          if [ "${{ inputs.destroy }}" = true ]; then
            args+=(-destroy)
            # Target everything except the resource group, so it (and what
            # Azure won't delete yet) stays.
            if [ "${{ inputs.keep_resource_group }}" = true ]; then
              while read -r address; do
                args+=("-target=$address")
              done < <(terraform state list | grep -v -e '^azurerm_resource_group\.app$' -e '^data\.')
            fi
          fi
          set +e
          terraform plan "${args[@]}"
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "has_changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: show plan
        run: terraform show -no-color tfplan

      # The apply job uses this exact plan.
      - name: publish plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ inputs.environment }}
          include-hidden-files: true # .terraform.lock.hcl
          retention-days: 1
          path: |
            infra
            !infra/.terraform/**

  apply:
    name: ${{ inputs.destroy && 'destroy' || 'apply' }} ${{ inputs.environment }}
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    concurrency: tfstate-${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-${{ inputs.environment }}
          path: infra

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.BACKEND_AZURE_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}" \
            -backend-config="key=${{ inputs.environment }}.tfstate"

      - name: terraform ${{ inputs.destroy && 'destroy' || 'apply' }}
        run: terraform apply -input=false -auto-approve tfplan
