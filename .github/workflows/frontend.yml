# Build the frontend image, push it to ACR and roll the container app.
#
# Runs in the nonprod GitHub environment (main only) and signs in with OIDC
# as the narrow CI identity in infra/github-oidc.tf, not the landing zone's
# deploy identity. No secrets are stored. Environment variables (set by the
# vending bootstrap):
#   CI_AZURE_CLIENT_ID, AZURE_SUBSCRIPTION_ID, ACR_NAME,
#   CONTAINER_APP_NAME, RESOURCE_GROUP. Repository variable: AZURE_TENANT_ID.
name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for Azure

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  # The same checks as CI (hadolint, build, Trivy), so nothing untested is
  # deployed.
  checks:
    name: checks
    permissions:
      contents: read
    uses: ./.github/workflows/app-checks.yml
    with:
      api: false
      frontend: true

  deploy:
    name: build, push, deploy
    needs: checks
    runs-on: ubuntu-latest
    environment: nonprod
    env:
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/frontend:${{ github.sha }}
      AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt # containerapp extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.CI_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          az acr login --name "$ACR_NAME"
          docker build --pull -t "$IMAGE" frontend
          docker push "$IMAGE"

      - name: Deploy to Container Apps
        env:
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
        run: |
          az containerapp update --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --image "$IMAGE" --output none
          fqdn=$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "Deployed $IMAGE to https://$fqdn" >> "$GITHUB_STEP_SUMMARY"
          echo "FQDN=$fqdn" >> "$GITHUB_ENV"

      # The deploy only counts if the public URL serves the page and the
      # whole path frontend -> API -> database works. Retries while the new
      # revision starts (it scales from zero). "|| true" because the step
      # runs with bash -e: a timeout means "not ready yet", not "give up".
      - name: Smoke test
        run: |
          for i in $(seq 1 24); do
            page=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "https://$FQDN/healthz" || true)
            db=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "https://$FQDN/api/health/db" || true)
            if [ "$page" = 200 ] && [ "$db" = 200 ]; then break; fi
            sleep 5
          done
          echo "frontend=$page database-through-api=$db" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$page" = 200 ] && [ "$db" = 200 ]
