# App checks, shared by ci.yml (every PR and push) and the deploy workflows
# (which run them again before deploying, so nothing untested ships).
#
# Actions are pinned to full commit SHAs (tag in the comment).
name: app-checks

on:
  workflow_call:
    inputs:
      api:
        type: boolean
        default: true
      frontend:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  api:
    name: api (tests, lint, security)
    if: inputs.api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12" # Ubuntu 24.04's Python, as on the VM
      - run: pip install --disable-pip-version-check -r requirements-dev.txt
      - name: ruff (lint)
        run: ruff check --output-format github .
      - name: ruff (format)
        run: ruff format --check .
      - name: bandit (security)
        run: bandit -c pyproject.toml -r .
      - name: pytest
        run: pytest -q

  frontend:
    name: frontend (lint, build, scan)
    if: inputs.frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hadolint (Dockerfile)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: frontend/Dockerfile
      - name: docker build
        run: docker build --pull -t frontend:ci frontend
      # Fails on critical vulnerabilities that have a fix available; the full
      # report (high and critical) is in the log.
      - name: trivy (image vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: frontend:ci
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"
      - name: trivy (fail on critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: frontend:ci
          version: v0.76.2
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true
