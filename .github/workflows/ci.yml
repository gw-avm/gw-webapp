# Checks for every pull request (and main). "CI Result" sums them up for the
# branch ruleset. Terraform plans and applies run in infra-cd.yml from main;
# a plan on pull requests comes in a later change.
#
# Actions are pinned to full commit SHAs (tag in the comment).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"
  CHECKOV_VERSION: "3.3.28"
  ANSIBLE_LINT_VERSION: "26.9.0"
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --chdir=infra --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  checkov:
    name: checkov (Terraform + Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check "checkov==${CHECKOV_VERSION}"
      # Deliberate exceptions are documented inline with #checkov:skip=<id>:<reason>
      - run: checkov -d . --framework terraform dockerfile --compact --quiet --skip-download

  ansible:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check "ansible-lint==${ANSIBLE_LINT_VERSION}"
      - run: ansible-lint site.yml
        working-directory: ansible

  app:
    name: app
    uses: ./.github/workflows/app-checks.yml

  # Blocks PRs that add dependencies with known vulnerabilities.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # One fixed check name for the branch ruleset (main-requires-ci), however
  # the jobs above change. always() so it fails, rather than skips, when a
  # job fails: GitHub treats a skipped required check as passed.
  result:
    name: CI Result
    if: always()
    needs: [terraform, tflint, checkov, ansible, app, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed (or were skipped)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1
          done
