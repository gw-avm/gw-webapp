# Publish the API config bundle (ansible/ + api/) and apply it on the VM.
# The VM also re-applies the latest bundle every 15 minutes by itself;
# Run Command here just makes a deploy take effect straight away.
#
# Runs in the nonprod GitHub environment (main only) and signs in with OIDC
# as the narrow CI identity in infra/github-oidc.tf, not the landing zone's
# deploy identity. Environment variables (set by the vending bootstrap):
#   CI_AZURE_CLIENT_ID, AZURE_SUBSCRIPTION_ID, STORAGE_ACCOUNT,
#   API_VM_NAME, RESOURCE_GROUP. Repository variable: AZURE_TENANT_ID.
name: api

on:
  push:
    branches: [main]
    paths: ["api/**", "ansible/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for Azure

concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  # The same checks as CI, so nothing untested is deployed.
  checks:
    name: checks
    permissions:
      contents: read
    uses: ./.github/workflows/app-checks.yml
    with:
      api: true
      frontend: false

  deploy:
    name: publish bundle, apply on VM
    needs: checks
    runs-on: ubuntu-latest
    environment: nonprod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.CI_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish bundle
        env:
          STORAGE_ACCOUNT: ${{ vars.STORAGE_ACCOUNT }}
        run: |
          # Tests and dev-only files stay out of the bundle (and off the VM).
          tar -czf api-bundle.tar.gz --exclude=api/tests --exclude=api/requirements-dev.txt \
            --exclude=api/pyproject.toml --exclude='__pycache__' ansible api
          az storage blob upload --auth-mode login --account-name "$STORAGE_ACCOUNT" \
            --container-name deploy --name api-bundle.tar.gz --file api-bundle.tar.gz \
            --overwrite --metadata "commit=$GITHUB_SHA" --output none

      - name: Apply on the VM
        env:
          API_VM_NAME: ${{ vars.API_VM_NAME }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
        run: |
          out=$(az vm run-command invoke --resource-group "$RESOURCE_GROUP" --name "$API_VM_NAME" \
            --command-id RunShellScript \
            --scripts "systemctl start gw-config.service && echo DEPLOY_OK; journalctl -u gw-config.service -n 15 --no-pager" \
            --query "value[0].message" -o tsv)
          echo "$out"
          { echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q DEPLOY_OK <<<"$out"

      # The deploy only counts if the running API answers and can reach the
      # database, as the real service user with its real hardening. Retries
      # while the service restarts.
      - name: Smoke test
        env:
          API_VM_NAME: ${{ vars.API_VM_NAME }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
        run: |
          out=$(az vm run-command invoke --resource-group "$RESOURCE_GROUP" --name "$API_VM_NAME" \
            --command-id RunShellScript \
            --scripts 'for i in $(seq 1 12); do
                         api=$(curl -s -o /dev/null -w "%{http_code}" -m 5 localhost:8000/api/health)
                         db=$(curl -s -o /dev/null -w "%{http_code}" -m 20 localhost:8000/api/health/db)
                         if [ "$api" = 200 ] && [ "$db" = 200 ]; then echo SMOKE_OK; break; fi
                         sleep 5
                       done
                       echo "api=$api db=$db"; curl -s -m 20 localhost:8000/api/health/db' \
            --query "value[0].message" -o tsv)
          echo "$out"
          { echo '### Smoke test'; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q SMOKE_OK <<<"$out"
